<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>After Midnight Mall | Owner Login</title>
    <style>
      :root {
        --bg: #0d1117;
        --bg-2: #171c22;
        --card: rgba(19, 23, 29, 0.94);
        --line: rgba(255,255,255,0.08);
        --text: #f3efe8;
        --muted: #b6b0a7;
        --accent: #f2c98d;
        --accent-strong: #f6d8a7;
        --error: #f08c8c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at top, #1b2129, var(--bg) 42%);
        color: var(--text);
        padding: 24px;
      }

      .login-box {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 30px 70px rgba(0,0,0,0.36);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), #f9d59b);
        color: #161515;
        font-weight: 800;
      }

      .brand-name {
        font-size: 1.02rem;
        font-weight: 700;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: var(--muted);
        font-weight: 600;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 0.9rem 0.95rem;
      }

      input:focus {
        outline: none;
        border-color: rgba(242, 201, 141, 0.9);
        box-shadow: 0 0 0 4px rgba(242, 201, 141, 0.12);
      }

      button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #f9d9a0);
        color: #1d1d1d;
        padding: 0.9rem 1rem;
        font-weight: 800;
        cursor: pointer;
      }

      .message {
        min-height: 20px;
        font-size: 0.82rem;
      }

      .password-wrap {
        position: relative;
      }

      .password-wrap input {
        padding-right: 68px;
      }

      .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-radius: 8px;
        padding: 0.4rem 0.65rem;
        cursor: pointer;
        font-size: 0.72rem;
      }

      .message.error {
        color: var(--error);
      }

      .message.success {
        color: #9af0c7;
      }

      .quick-contact {
        margin-top: 18px;
        font-size: 0.78rem;
        line-height: 1.6;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="brand">
        <span class="brand-mark">A</span>
        <span class="brand-name">After Midnight Mall</span>
      </div>

      <form id="adminLoginForm">
        <label>
          Owner email
          <input id="ownerEmail" type="email" placeholder="owner@aftermidnightmall.com" required />
        </label>

        <label>
          Password
          <div class="password-wrap">
            <input id="ownerPassword" type="password" placeholder="Enter owner password" required />
            <button type="button" class="toggle-password" aria-label="Show password">Show</button>
          </div>
        </label>

        <div id="adminMessage" class="message" aria-live="polite"></div>
        <button type="submit">Access verification panel</button>
      </form>

      <div class="quick-contact">
        Support: ericjuer@gmail.com<br />
        Phone: +255 760 087 130
      </div>
    </div>

    <script>
      const form = document.getElementById('adminLoginForm');
      const message = document.getElementById('adminMessage');
      const togglePasswordButton = document.querySelector('.toggle-password');
      const ownerPasswordInput = document.getElementById('ownerPassword');
      const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:5000' : '';

      async function fetchJson(url, options = {}) {
        const response = await fetch(`${API_BASE}${url}`, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });

        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || 'Request failed.');
        return body;
      }

      function setMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
      }

      togglePasswordButton?.addEventListener('click', () => {
        const isPassword = ownerPasswordInput.type === 'password';
        ownerPasswordInput.type = isPassword ? 'text' : 'password';
        togglePasswordButton.textContent = isPassword ? 'Hide' : 'Show';
        togglePasswordButton.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = document.getElementById('ownerEmail').value.trim();
        const password = document.getElementById('ownerPassword').value.trim();

        try {
          const result = await fetchJson('/api/owner/login', {
            method: 'POST',
            body: JSON.stringify({ email, password }),
          });

          setMessage(result.message || 'Access granted. Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 700);
        } catch (error) {
          setMessage(error.message || 'Invalid owner credentials.', 'error');
        }
      });
    </script>
  </body>
</html>
